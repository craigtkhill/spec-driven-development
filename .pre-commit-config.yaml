repos:
  - repo: local
    hooks:
      - id: check-skill-length
        name: check skill length
        entry: scripts/check-skill-length.sh
        language: script
        files: SKILL\.md$
      - id: check-workflow-diagram
        name: check workflow diagram
        entry: uv run python -I scripts/check-workflow-diagram.py
        language: system
        files: ^(skills/|workflow\.svg$)
        pass_filenames: false
      - id: check-protected
        name: check protected files
        entry: scripts/check-protected.sh
        language: script
        always_run: true
        pass_filenames: false
